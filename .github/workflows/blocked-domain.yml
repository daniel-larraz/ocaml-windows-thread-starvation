# Does a domain blocked in a read hold up everyone else's collections
# on Windows? The arms turn the two ingredients on and off separately,
# so a stall belongs to their combination or to neither.
name: A domain blocked in a read

on:
  workflow_dispatch:

jobs:
  blocked:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.5.1

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        opam exec -- ocamlopt -I +unix -I +threads unix.cmxa threads.cmxa \
          blocked_domain.ml -o blocked_domain.exe

    - name: Run
      shell: bash
      run: |
        set -u
        # busy / blocked / block seconds. The last two arms are the
        # controls: allocation with nothing blocked, and blocking with
        # nothing allocating. Neither should stall if the collision is
        # what matters.
        for arm in "8 2 5.0" "8 2 2.0" "3 1 5.0" "8 0 5.0" "0 2 5.0" ; do
          echo "== busy/blocked/block = $arm =="
          ./blocked_domain.exe $arm 20
        done
