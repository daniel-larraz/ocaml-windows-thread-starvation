# Is it Windows' starvation guard?
#
# The freeze lengths sit at 5.2-6.1s with a second cluster at roughly
# double, through every change tried so far -- the back-off cap, no
# Sleep below a tick, three scheduler time-slice settings. The runtime
# has no timeout of that size; all its waits are INFINITE. Windows does:
# once a second the balance set manager boosts any thread that has been
# ready but unscheduled for about four seconds. Four seconds plus up to
# one of scanning plus the rest of the barrier is five to six.
#
# What would starve a ready domain is threads running at a boosted
# priority, and Windows boosts a thread briefly each time it wakes from
# a wait -- which the idle domains do every 10ms. So turn those boosts
# off for the process and see whether the freezes go.
#
# Both arms make the same PowerShell call at the same moment, one
# writing and one only reading, so the call itself is not the
# difference. Interleaved round by round.
name: Is it the starvation guard

on:
  workflow_dispatch:

jobs:
  boost:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.5.1

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        opam exec -- ocamlopt -I +unix -I +threads unix.cmxa threads.cmxa \
          barrier.ml -o barrier.exe
        opam exec -- ocamlopt -I +unix -I +runtime_events \
          unix.cmxa runtime_events.cmxa probe_pauses.ml -o pauses.exe

    - name: Run
      shell: bash
      run: |
        # setup-ocaml's bash starts with -e and pipefail. In a measuring
        # loop that turns any single failure into a silent end of the
        # step -- three rounds have been lost to it -- so failures are
        # reported instead.
        set +e +o pipefail
        set -u
        for round in 1 2 3 ; do
        for boosts in on off ; do
          echo "== priority boosts $boosts (round $round) =="
          # A directory of this run's own, never reused. With one shared
          # directory an earlier run's ring file, still mapped while that
          # process exited, could be found in place of this one's -- which
          # is how both the pid lookup and the consumer went wrong before.
          evd="ev-$round-$boosts"
          mkdir -p "$evd"
          EVDIR=$(cygpath -w "$PWD/$evd")
          OCAML_RUNTIME_EVENTS_START=1 OCAML_RUNTIME_EVENTS_DIR="$EVDIR" \
            ./barrier.exe 11 30 3 > "out-$round-$boosts.txt" &
          target=$!

          # The Windows process ID, from the ring file's name. Not `$!`,
          # which is a Cygwin pid, and not what the program prints: on
          # Windows Unix.getpid returns a duplicated process handle.
          winpid=""
          for _ in $(seq 1 100) ; do
            f=$(ls "$evd" 2>/dev/null | grep -E '^[0-9]+\.events$' | head -1)
            if [ -n "$f" ] ; then winpid=${f%.events} ; break ; fi
            sleep 0.05
          done
          if [ -z "$winpid" ] ; then
            echo "   no ring file appeared -- this run is not measured"
          fi

          if [ "$boosts" = off ] ; then
            write='$p.PriorityBoostEnabled = $false ;'
          else
            write=''
          fi
          # Name the process behind the pid, so a wrong pid is visible
          # rather than silently measured.
          powershell -NoProfile -Command \
            "\$p = Get-Process -Id $winpid ; $write 'pid $winpid is ' + \$p.ProcessName + ', priority boost enabled: ' + \$p.PriorityBoostEnabled" \
            2>&1 | tr -d '\r' | head -2 | sed 's/^/   /'

          # The explicit pid, not 0: there is exactly one ring to watch.
          ./pauses.exe "$EVDIR" "$winpid" 34 > "ev-$round-$boosts.txt" 2>&1
          rc=$?
          if [ $rc -ne 0 ] ; then
            echo "   consumer exited $rc:"
            head -3 "ev-$round-$boosts.txt" | sed 's/^/     /'
          fi
          wait $target
          grep -a "worst ticker" "out-$round-$boosts.txt" || echo "   (no result line)"
          echo "   spans over 1s: $(grep -ac '^PAUSE' "ev-$round-$boosts.txt")"
          grep -a "^stw_handler" "ev-$round-$boosts.txt" | sed 's/^/   /' \
            || echo "   (no stw_handler line)"
        done
        done
