# Two experiments on the stop-the-world freeze, both on windows-latest,
# the only environment where it reproduces.
#
#   which-site   Stock 5.5.1 with OCAMLRUNPARAM=v=0x800, which makes the
#                runtime log "Slow spin-wait loop in <fn> at <file>:<line>"
#                whenever a back-off crosses 1ms. Names the site, no code
#                changes.
#
#   ab           5.5.1 built from source three ways -- unchanged, with the
#                spin back-off capped at 1ms instead of 1s, and with Sleep
#                skipped below one clock tick -- all by the same procedure,
#                so the only difference between arms is the patch.
#
# Why these: caml_plat_spin_back_off grows x1.25 from 10us to a 1s cap.
# A waiter that backs off all the way sleeps ~4.6s before its first 1s
# sleep, then +1s per round -- and the freezes cluster at 5.6-6.0s with
# a tail at 7, 8, 10, 14s. If the back-off tail is where the time goes,
# the 1ms cap removes the freezes and the no-sleep-below-tick variant,
# which only changes the early rounds, does not.
name: Is it the spin back-off

on:
  workflow_dispatch:

jobs:
  which-site:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.5.1
    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        opam exec -- ocamlopt -version
        opam exec -- ocamlopt -I +unix -I +threads unix.cmxa threads.cmxa \
          barrier.ml -o barrier.exe
    - name: Run with the slow spin-wait log on
      shell: bash
      run: |
        set -u
        # stderr to a file rather than the console: 0x800 turns on every
        # caml_gc_log, and writing it to a console would perturb the
        # timing far more than writing it to disk.
        for round in 1 2 ; do
        for arm in "11 3" "11 0" ; do
          set -- $arm
          echo "== allocating=$1 idle=$2 (round $round) =="
          OCAMLRUNPARAM=v=0x800 ./barrier.exe "$1" 30 "$2" 2> log.txt \
            | grep -a "worst ticker" || true
          echo "   log lines: $(wc -l < log.txt)"
          echo "   slow spin-wait loops, by site:"
          # Zero matches is a result, not an error -- but this shell runs
          # with -e and pipefail, so without the guard it ends the step.
          grep -a "Slow spin-wait loop" log.txt \
            | sed -E 's/^\[[0-9]+\] //' | sort | uniq -c | sort -rn | head -10 \
            | sed 's/^/     /' || echo "     (none)"
        done
        done

  ab:
    strategy:
      fail-fast: false
      matrix:
        arm: [stock, cap-1ms, no-sleep-below-tick]
    runs-on: windows-latest
    name: ab (${{ matrix.arm }})
    steps:
    - uses: actions/checkout@v6

    # Only for opam and its Cygwin toolchain; the compiler under test is
    # built from source below.
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.5.1

    - name: Fetch 5.5.1 and apply the arm's patch
      shell: bash
      run: |
        set -euo pipefail
        git clone -q --depth 1 --branch 5.5.1 --recurse-submodules --shallow-submodules \
          https://github.com/ocaml/ocaml.git ocaml-src
        if [ "${{ matrix.arm }}" != stock ] ; then
          # Relative: the runner's git is the native Windows one, and a
          # Cygwin path ("/cygdrive/d/...") is a file it cannot open.
          git -C ocaml-src apply "../patches/${{ matrix.arm }}.patch"
        fi
        git -C ocaml-src diff --stat
        grep -n "Max_sleep_nsec\|16 \* NSEC_PER_MSEC" ocaml-src/runtime/platform.c

    # The in-tree opam file is ocaml-variants at version 5.5.1, so that
    # is the name it is pinned under. A native path, since this opam is
    # a Windows program.
    - name: Build the compiler under test
      shell: bash
      run: |
        set -euo pipefail
        SRC=$(cygpath -w "$PWD/ocaml-src")
        opam switch create under-test --empty --yes
        opam pin add --switch under-test --yes --no-action --kind=path \
          ocaml-variants.5.5.1 "$SRC"
        opam install --switch under-test --yes ocaml-variants.5.5.1
        opam exec --switch under-test -- ocamlopt -version

    - name: Build the reproducer and the consumer
      shell: bash
      run: |
        set -euo pipefail
        opam exec --switch under-test -- ocamlopt -I +unix -I +threads \
          unix.cmxa threads.cmxa barrier.ml -o barrier.exe
        opam exec --switch under-test -- ocamlopt -I +unix -I +runtime_events \
          unix.cmxa runtime_events.cmxa probe_pauses.ml -o pauses.exe

    - name: Run
      shell: bash
      run: |
        set -u
        for round in 1 2 3 ; do
        for arm in "11 3" "11 0" ; do
          set -- $arm
          echo "== ${{ matrix.arm }}: allocating=$1 idle=$2 (round $round) =="
          rm -rf ev ; mkdir -p ev
          EVDIR=$(cygpath -w "$PWD/ev")
          OCAML_RUNTIME_EVENTS_START=1 OCAML_RUNTIME_EVENTS_DIR="$EVDIR" \
            ./barrier.exe "$1" 30 "$2" > out.txt &
          target=$!
          sleep 1
          ./pauses.exe "$EVDIR" 0 34 > ev.txt 2>&1
          wait $target || true
          grep -a "worst ticker" out.txt || echo "   (no result line)"
          echo "   spans over 1s: $(grep -ac '^PAUSE' ev.txt)"
          grep -a "^stw_handler" ev.txt | sed 's/^/   /' || echo "   (no stw_handler line)"
        done
        done
