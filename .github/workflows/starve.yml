# Four compilers on three platforms, one arm each way. The Windows
# 5.5.0 cell is the report; every other cell is the control that makes
# it mean something.
name: Does a busy thread starve its domain

on:
  workflow_dispatch:
  push:
    paths: [ 'starve.ml', '.github/workflows/starve.yml' ]

jobs:
  starve:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        ocaml: ["5.2.1", "5.3.0", "5.4.0", "5.5.0", "5.5.1"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ matrix.ocaml }}

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        opam exec -- ocamlopt -version
        opam exec -- ocamlopt -I +unix -I +threads unix.cmxa threads.cmxa \
          starve.ml -o starve.exe

    - name: Run
      shell: bash
      run: |
        set -u
        # Bounded, so that a thread which never gets its turn cannot hang
        # the job. Not `timeout`, which macOS does not have.
        bounded() {
          local secs=$1 ; shift
          "$@" & local pid=$!
          ( sleep "$secs" ; kill -9 "$pid" 2>/dev/null ) & local killer=$!
          wait "$pid" ; local rc=$?
          kill "$killer" 2>/dev/null
          wait "$killer" 2>/dev/null
          return $rc
        }

        for mode in busy alloc yield ; do
          for w in 0 1 ; do
            echo "== $mode workers=$w (expect ~8s) =="
            bounded 20 opam exec -- ./starve.exe $mode $w 8 \
              || echo "   NO RESULT: killed at 20s, or exit $?"
          done
        done

    # The same binary with no Cygwin shell and no `opam exec` between the
    # runner and the program, so the environment is not what is blamed.
    - name: Again, outside Cygwin and opam
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        foreach ($arm in @(@('busy',1), @('yield',1))) {
          $mode = $arm[0] ; $w = $arm[1]
          Write-Host "== $mode workers=$w (expect ~8s) =="
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath .\starve.exe -ArgumentList $mode,$w,8 `
                 -PassThru -NoNewWindow
          if ($p.WaitForExit(20000)) {
            $clock.Stop()
            Write-Host ("   exit {0} after {1:N1}s" -f $p.ExitCode, $clock.Elapsed.TotalSeconds)
          } else {
            $clock.Stop() ; $p.Kill()
            Write-Host "   NO RESULT: still running at 20s"
          }
        }
