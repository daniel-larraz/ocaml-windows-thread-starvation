# Does ocaml/ocaml#15029 fix it?
#
# Two switches built the same way on the same runner: the branch the
# pull request is based on, which must still hang, and the branch
# itself, which must not. Without the first, a green second says only
# that something changed.
name: Confirm the fix for 15029

on:
  workflow_dispatch:

jobs:
  confirm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "base 5.5 (expect hangs)"
            url: "git+https://github.com/ocaml/ocaml#5.5"
          - name: "PR 15029 (expect finishes)"
            url: "git+https://github.com/nojb/ocaml#fix_win32_backup_thread"
    runs-on: windows-latest
    name: ${{ matrix.name }}
    steps:
    - uses: actions/checkout@v6

    # Only to get opam and its Cygwin toolchain; the switch below is
    # what the reproducer is built against.
    - name: Set up opam
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.5.0

    # `opam switch create <name> <git url>` is not a thing -- opam reads
    # the argument as a package. The compiler package is pinned to the
    # branch instead, then installed from it. Both branches say
    # 5.5.1+dev0-2026-06-19, which is what ocaml-variants.5.5.1+trunk
    # expects.
    - name: Build the compiler under test
      shell: bash
      run: |
        set -euo pipefail
        opam switch create under-test --empty --yes
        opam pin add --switch under-test --yes --no-action \
          ocaml-variants.5.5.1+trunk "${{ matrix.url }}"
        opam install --switch under-test --yes ocaml-variants.5.5.1+trunk
        opam exec --switch under-test -- ocamlopt -version

    - name: Build the reproducer
      shell: bash
      run: |
        set -euo pipefail
        opam exec --switch under-test -- ocamlopt \
          -I +unix -I +threads unix.cmxa threads.cmxa starve.ml -o starve.exe

    - name: Run
      shell: bash
      run: |
        set -u
        bounded() {
          local secs=$1 ; shift
          "$@" & local pid=$!
          ( sleep "$secs" ; kill -9 "$pid" 2>/dev/null ) & local killer=$!
          wait "$pid" ; local rc=$?
          kill "$killer" 2>/dev/null
          wait "$killer" 2>/dev/null
          return $rc
        }

        for mode in busy alloc yield ; do
          for w in 0 1 ; do
            echo "== $mode workers=$w (expect ~8s) =="
            bounded 20 ./starve.exe $mode $w 8 \
              || echo "   NO RESULT: killed at 20s, or exit $?"
          done
        done
